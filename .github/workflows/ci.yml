name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test
        env:
          PUBLIC_SUPABASE_URL: https://test.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_test_mock
          ELEVENLABS_API_KEY: sk_mock
          ANTHROPIC_API_KEY: sk_mock

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Start local Supabase
        run: supabase start

      - name: Export local Supabase credentials
        id: supabase
        run: |
          STATUS=$(supabase status --output json)
          echo "url=$(echo $STATUS | jq -r '.API_URL')" >> $GITHUB_OUTPUT
          echo "anon_key=$(echo $STATUS | jq -r '.ANON_KEY')" >> $GITHUB_OUTPUT

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
          STRIPE_SECRET_KEY: sk_test_e2e_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_e2e_placeholder
          ELEVENLABS_API_KEY: sk_e2e_placeholder
          ANTHROPIC_API_KEY: sk_e2e_placeholder

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
